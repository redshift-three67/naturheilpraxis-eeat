<p>Biovalent System ist der frühere Name von Lowen Systems. Frank Lowen entwickelte das Konzept nach intensiver Arbeit mit craniosacralen und viszeralen Ansätzen.</p>
<p>„Sanft und zielsicher“ beschreibt den Anspruch der Schule, nicht ein gesichertes Behandlungsergebnis.</p>
