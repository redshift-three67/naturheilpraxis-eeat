<p>Regulatoren bezeichnen in Lowen Systems Stellen, an denen Bewegungs- und Spannungsänderungen wahrgenommen werden. Es ist ein Arbeitsbegriff der Methode.</p>
<p>Sanfte Griffe an diesen Stellen sind ein manuelles Vorgehen. Ein bestimmtes Regulationsergebnis wird nicht zugesagt.</p>
