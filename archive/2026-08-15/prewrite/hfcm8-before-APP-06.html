<style>
.eeat-anamnese-wrap{text-align:center;margin:.55rem auto 0;padding:0}
.eeat-anamnese-btn{display:inline-block;width:min(360px,92vw);background:#bebaa0;color:#fff!important;text-decoration:none!important;padding:11px 16px;box-shadow:2px 3px 6px rgba(25,20,17,.35);font-family:"Open Sans",sans-serif;line-height:1.25;text-align:center}
.eeat-anamnese-btn:hover{filter:brightness(1.06);color:#fff!important}
.eeat-anamnese-l1{display:block;font-size:16px;font-weight:400}
.eeat-anamnese-l2{display:block;font-size:12px;font-weight:300;opacity:.88;margin-top:2px}
</style>
<div id="eeat-online-anamnese" class="eeat-anamnese-wrap">
  <a class="eeat-anamnese-btn" href="https://naturheilpraxis-rauch.lovable.app/" target="_blank" rel="noopener">
    <span class="eeat-anamnese-l1">Online-Anamnesebogen</span>
    <span class="eeat-anamnese-l2">Patientenaufnahme vor dem Termin</span>
  </a>
</div>
<script>
(function () {
  var src = document.getElementById('eeat-online-anamnese');
  if (!src) return;
  function after(el, node) {
    if (!el || !el.parentNode) return false;
    el.parentNode.insertBefore(node, el.nextSibling);
    return true;
  }
  var termin = Array.prototype.find.call(document.querySelectorAll('h3, a, .el-title'), function (el) {
    return /Jetzt\s+Termin\s+buchen/i.test((el.textContent || '').replace(/\s+/g, ' '));
  });
  var pe = document.querySelector('img[data-src*="provenexpert"], img[src*="provenexpert"], img[alt*="Kundenbewertungen"]');
  if (termin) {
    var card = termin.closest('a.el-item, .uk-card, .uk-margin-small') || termin.parentElement;
    after(card, src);
  }
  if (pe) {
    var wrap = pe.closest('a') || pe.parentElement;
    if (termin) {
      var clone = src.cloneNode(true);
      clone.id = 'eeat-online-anamnese-pe';
      after(wrap, clone);
    } else {
      after(wrap, src);
    }
  }
})();
</script>
