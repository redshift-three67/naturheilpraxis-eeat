<style id="eeat-speed-slider-mobile">
@media (prefers-reduced-motion: reduce) {
  .uk-slideshow .uk-animation-kenburns { animation: none !important; transform: none !important; }
}
@media (max-width: 959px) {
  .uk-slideshow .uk-animation-kenburns {
    animation: none !important;
    transform: none !important;
  }
  .uk-slideshow-items {
    min-height: 260px !important;
    height: 46vh !important;
    max-height: 400px !important;
  }
}
</style>
<script>
(function () {
  function apply() {
    var img = document.querySelector('.uk-slideshow-items > *:first-child img');
    if (img) {
      img.loading = 'eager';
      img.setAttribute('loading', 'eager');
      img.fetchPriority = 'high';
      img.setAttribute('fetchpriority', 'high');
    }
    document.querySelectorAll('a[href*="naturheilpraxis-rauch.lovable.app"]').forEach(function (a) {
      if (!/\bnoopener\b/.test(a.rel || '')) a.rel = (a.rel ? a.rel + ' ' : '') + 'noopener';
    });
  }
  apply();
  document.addEventListener('DOMContentLoaded', apply);
  window.addEventListener('load', apply);
  setTimeout(apply, 50);
  setTimeout(apply, 400);
  setTimeout(apply, 1200);
})();
</script>
