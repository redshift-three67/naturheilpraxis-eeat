<style>
.eeat-anamnese-wrap{text-align:center;margin:.55rem auto 0;padding:0}
.eeat-anamnese-btn{display:inline-block;width:min(360px,92vw);box-sizing:border-box;background:#bebaa0;color:#2a2622!important;text-decoration:none!important;padding:11px 16px;border:2px solid #8ec760;box-shadow:2px 3px 6px rgba(25,20,17,.35);font-family:"Open Sans",sans-serif;line-height:1.25;text-align:center}
.eeat-anamnese-btn:hover{filter:brightness(1.06);color:#2a2622!important}
.eeat-anamnese-l1{display:block;font-size:16px;font-weight:400}
.eeat-anamnese-l2{display:block;font-size:12px;font-weight:300;opacity:.88;margin-top:2px}
#eeat-online-anamnese-pe{margin:.55rem auto 0;padding:0;text-align:center}
#eeat-online-anamnese-pe .eeat-anamnese-btn{width:100%}
</style>
<div id="eeat-online-anamnese" class="eeat-anamnese-wrap">
  <a class="eeat-anamnese-btn" href="https://naturheilpraxis-rauch.lovable.app/" target="_blank" rel="noopener">
    <span class="eeat-anamnese-l1">Online-Anamnesebogen</span>
    <span class="eeat-anamnese-l2">Patientenaufnahme vor dem Termin</span>
  </a>
</div>
<script>
(function () {
  var src = document.getElementById('eeat-online-anamnese');
  if (!src) return;
  function after(el, node) {
    if (!el || !el.parentNode) return false;
    el.parentNode.insertBefore(node, el.nextSibling);
    return true;
  }
  var termin = Array.prototype.find.call(document.querySelectorAll('h3, a, .el-title'), function (el) {
    return /Jetzt\s+Termin\s+buchen/i.test((el.textContent || '').replace(/\s+/g, ' '));
  });
  var pe = document.querySelector('img[data-src*="provenexpert"], img[src*="provenexpert"], img[alt*="Kundenbewertungen"]');
  if (termin) {
    var card = termin.closest('a.el-item, .uk-card, .uk-margin-small') || termin.parentElement;
    after(card, src);
  }
  if (pe) {
    var wrap = pe.closest('a') || pe.parentElement;
    if (termin) {
      var clone = src.cloneNode(true);
      clone.id = 'eeat-online-anamnese-pe';
      after(wrap, clone);
    } else {
      after(wrap, src);
    }
  }
  function fitPeWidth() {
    var img = document.querySelector('img[data-src*="provenexpert"], img[src*="provenexpert"], img[alt*="Kundenbewertungen"]');
    var box = document.getElementById('eeat-online-anamnese-pe');
    if (!img || !box) return;
    var w = Math.round(img.getBoundingClientRect().width);
    if (w > 80) {
      box.style.width = w + 'px';
      box.style.maxWidth = w + 'px';
    }
  }
  fitPeWidth();
  if (pe) {
    pe.addEventListener('load', fitPeWidth);
    if (window.MutationObserver) {
      new MutationObserver(fitPeWidth).observe(pe, { attributes: true, attributeFilter: ['src', 'srcset', 'class', 'style'] });
    }
  }
  window.addEventListener('resize', fitPeWidth);
  setTimeout(fitPeWidth, 400);
  setTimeout(fitPeWidth, 1400);
})();
</script>
