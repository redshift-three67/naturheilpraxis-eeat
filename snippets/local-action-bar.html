<script>
(function () {
  var ok = /^\/$|\/nls-diagnostik\/?$|\/bioresonanz-und-elektroakupunktur\/?$|\/naturheilkunde\/?$|\/psychotherapie-augsburg\/?$|\/manuelle-therapieverfahren-uebersicht\/?$|\/schmerztherapie-augsburg\/?$/.test(location.pathname);
  var bar = document.getElementById("eeat-local-bar");
  if (!ok || !bar) {
    if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
    return;
  }
  function place() {
    var h1 = document.querySelector("h1");
    if (!h1 || bar.classList.contains("is-on") && h1.nextElementSibling === bar) return;
    h1.insertAdjacentElement("afterend", bar);
    bar.classList.add("is-on");
  }
  place();
  document.addEventListener("DOMContentLoaded", place);
  window.addEventListener("load", place);
  setTimeout(place, 400);
})();
</script>
