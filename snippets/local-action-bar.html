<style id="eeat-local-bar-css">
#eeat-local-bar {
  display: none;
  width: 100%;
  max-width: none;
  margin: 0.5rem 0 0.25rem;
  padding: 0;
  box-sizing: border-box;
}
#eeat-local-bar.is-on {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 8px;
}
#eeat-local-bar a,
#eeat-local-bar .eeat-local-hours {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  min-height: 44px;
  padding: 8px 12px 8px 10px;
  border: 1px solid #2a2622;
  color: #2a2622 !important;
  text-decoration: none;
  font-family: "Open Sans", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.25;
  background: #fff;
  box-sizing: border-box;
}
#eeat-local-bar a:focus,
#eeat-local-bar a:hover {
  outline: 2px solid #8ec760;
  outline-offset: 2px;
}
#eeat-local-bar svg {
  flex: 0 0 18px;
  width: 18px;
  height: 18px;
  display: block;
}
#eeat-local-bar .eeat-local-hours {
  border-style: dashed;
}
html.eeat-type-a .eeat-slogan,
html.eeat-type-a .uk-section .eeat-slogan,
html.eeat-type-a .uk-panel.eeat-slogan,
html.eeat-type-a h2.eeat-slogan {
  font-family: "Open Sans", sans-serif !important;
  font-size: 18px !important;
  font-weight: 700 !important;
  line-height: 1.4 !important;
  color: #2a2622 !important;
  margin: 0.35rem 0 0 !important;
  display: block !important;
}
@media (max-width: 639px) {
  html.eeat-type-a .eeat-slogan,
  html.eeat-type-a .uk-section .eeat-slogan,
  html.eeat-type-a h2.eeat-slogan { font-size: 17px !important; font-weight: 700 !important; }
  #eeat-local-bar a,
  #eeat-local-bar .eeat-local-hours { font-size: 13px; padding: 7px 10px 7px 8px; }
}
.tm-header .uk-navbar-dropdown a.eeat-hub-link,
#tm-mobile a.eeat-hub-link,
.uk-offcanvas a.eeat-hub-link {
  position: relative;
}
.tm-header .uk-navbar-dropdown a.eeat-hub-link::before,
#tm-mobile a.eeat-hub-link::before,
.uk-offcanvas a.eeat-hub-link::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 7px 0 0;
  border-radius: 50%;
  background: #8ec760;
  vertical-align: middle;
  flex: 0 0 6px;
}
.uk-navbar-nav > li > a.eeat-hub-link {
  position: relative;
  padding-left: 14px;
}
.uk-navbar-nav > li > a.eeat-hub-link::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 0.55em;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #8ec760;
}
</style>

<script>
(function () {
  var ok = /^\/$|\/nls-diagnostik\/?$|\/bioresonanz-und-elektroakupunktur\/?$|\/naturheilkunde\/?$|\/psychotherapie-augsburg\/?$|\/manuelle-therapieverfahren-uebersicht\/?$|\/schmerztherapie-augsburg\/?$|\/online-anamnesebogen\/?$/.test(location.pathname);
  var bar = document.getElementById("eeat-local-bar");
  function markHubs() {
    var hubs = {
      "/nls-diagnostik/": 1,
      "/bioresonanz-und-elektroakupunktur/": 1,
      "/naturheilkunde/": 1,
      "/psychotherapie-augsburg/": 1,
      "/manuelle-therapieverfahren-uebersicht/": 1,
      "/schmerztherapie-augsburg/": 1,
      "/online-anamnesebogen/": 1
    };
    document.querySelectorAll(".uk-navbar a, #tm-mobile a, .uk-offcanvas a").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      if (href.indexOf("#tm-mobile") !== -1) return;
      if (/^\s*Menü\s*$/i.test(a.textContent || "")) return;
      var path = (a.pathname || "").replace(/\/?$/, "/") || "/";
      if (hubs[path]) a.classList.add("eeat-hub-link");
    });
  }
  markHubs();
  document.addEventListener("DOMContentLoaded", markHubs);
  if (!ok) {
    if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
    return;
  }
  document.documentElement.classList.add("eeat-type-a");
  function textOf(el) {
    return (el.textContent || "").replace(/\s+/g, " ").trim();
  }
  function sloganEl() {
    var nodes = document.querySelectorAll("h1, h2, h3, p, .uk-panel");
    var best = null;
    var bestLen = 1e9;
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.id === "eeat-local-bar" || (el.closest && el.closest("#eeat-local-bar"))) continue;
      if (el.querySelector && el.querySelector("h1")) continue;
      var t = textOf(el);
      if (!/Naturheilkundlich begleiten/i.test(t) || !/Stark im Leben/i.test(t)) continue;
      if (t.length > 72) continue;
      if (t.length < bestLen) {
        best = el;
        bestLen = t.length;
      }
    }
    return best;
  }
  function place() {
    var h1 = document.querySelector("h1");
    var s = sloganEl();
    if (s) {
      s.classList.add("eeat-slogan");
      s.removeAttribute("hidden");
      s.style.removeProperty("display");
    }
    var anchor = s || h1;
    if (!anchor || !bar) return;
    if (anchor.nextElementSibling === bar && bar.classList.contains("is-on")) return;
    anchor.insertAdjacentElement("afterend", bar);
    bar.classList.add("is-on");
  }
  place();
  document.addEventListener("DOMContentLoaded", place);
  window.addEventListener("load", place);
  setTimeout(place, 200);
  setTimeout(place, 800);
})();
</script>
